#cloud-config

package_update: true
package_upgrade: true

write_files:

  - path: /usr/local/bin/docker.sh
    permissions: "0755"
    content: |
${indent(6, docker_script)}

  - path: /usr/local/bin/k3s.sh
    permissions: "0755"
    content: |
${indent(6, k3s_script)}

  - path: /usr/local/bin/helm.sh
    permissions: "0755"
    content: |
${indent(6, helm_script)}

runcmd:
  - /usr/local/bin/docker.sh
  - /usr/local/bin/k3s.sh
  - /usr/local/bin/helm.sh
