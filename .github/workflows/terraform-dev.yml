name: Deploy Development

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Diagnose OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "=== REQUESTING GITHUB OIDC TOKEN ==="

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value // empty')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: GitHub did not return an OIDC token."
            echo "$RESPONSE"
            exit 1
          fi

          echo "OIDC token received successfully."
          echo

          OIDC_TOKEN="$TOKEN" python3 <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]

          parts = token.split(".")

          if len(parts) != 3:
              raise SystemExit("ERROR: OIDC token is not a valid JWT.")

          payload = parts[1]
          payload += "=" * (-len(payload) % 4)

          try:
              decoded = base64.urlsafe_b64decode(payload)
              claims = json.loads(decoded)
          except Exception as e:
              raise SystemExit(f"ERROR: Could not decode OIDC payload: {e}")

          print("=== OIDC CLAIMS ===")

          important_claims = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "ref_type",
              "event_name",
              "workflow",
              "workflow_ref",
              "workflow_sha",
              "job_workflow_ref",
              "runner_environment",
              "repository_visibility",
              "run_id",
              "run_number",
              "run_attempt"
          ]

          for key in important_claims:
              if key in claims:
                  print(f"{key}: {claims[key]}")

          print("===================")
          PY

      - name: Show role ARN
        run: |
         echo "AWS_ROLE_ARN=${{ secrets.AWS_ROLE_ARN }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Terraform Init
        run: terraform init -backend-config=environments/dev/backend.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=environments/dev/terraform.tfvars

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=environments/dev/terraform.tfvars
